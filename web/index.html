<!DOCTYPE html>
<html>

<head>
    <title>Endurance Client</title>
    <script type="text/javascript" src="/eel.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0b0f14;
            color: #e6edf3;
            padding: 20px;
        }

        #login-section,
        #chat-section {
            max-width: 500px;
            margin: auto;
        }

        h2 {
            color: #3cff88;
            text-shadow: 0 0 8px #3cff8844;
        }

        #chat-section {
            display: none;
        }

        #chat-history {
            background-color: #111821;
            border: 1px solid #1f2a36;
            height: 320px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .msg {
            margin-bottom: 6px;
            padding: 6px 8px;
            border-radius: 6px;
        }

        .msg.self {
            background-color: #1b2b22;
            border-left: 3px solid #3cff88;
        }

        .msg.other {
            background-color: #161c24;
        }

        .msg.system {
            color: #8899aa;
            font-style: italic;
        }

        .msg b {
            color: #3cff88;
        }

        input {
            width: calc(100% - 10px);
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #1f2a36;
            background-color: #0f141a;
            color: #e6edf3;
            outline: none;
        }

        input:focus {
            border-color: #3cff88;
            box-shadow: 0 0 6px #3cff8844;
        }

        button {
            background-color: #1a242f;
            color: #3cff88;
            border: 1px solid #3cff88;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #3cff88;
            color: #0b0f14;
        }

        #chat-title {
            color: #3cff88;
        }

        #chat-history::-webkit-scrollbar {
            width: 6px;
        }

        #chat-history::-webkit-scrollbar-thumb {
            background: #3cff88;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div id="login-section">
        <h2>Endurance</h2>

        <input type="text" id="username" placeholder="Username"
            onkeydown="if(event.key === 'Enter') document.getElementById('password').focus()">

        <input type="password" id="password" placeholder="Password"
            onkeydown="if(event.key === 'Enter') triggerPython('login')">

        <button onclick="triggerPython('login')">Login</button>
        <button onclick="triggerPython('create')">Create Account</button>

        <p id="status-text"></p>
    </div>

    <div id="chat-section">

        <h2>Room: <span id="chat-title">Server</span></h2>

        <input type="text" id="dm-user-input" placeholder="User to DM..."
            onkeydown="if(event.key === 'Enter') switchToDM()">

        <button onclick="switchToDM()">DM User</button>
        <button onclick="switchToServer()">Back to Server</button>

        <div id="chat-history"></div>

        <div style="display: flex; gap: 5px; margin-bottom: 8px;">
            <input type="file" id="file-input" style="width: auto; margin-bottom: 0;">
            <button onclick="sendFile()">Send File</button>
        </div>

        <input type="text" id="message-input" placeholder="Type a message..."
            onkeydown="if(event.key === 'Enter') sendMessage()">

        <button onclick="sendMessage()">Send</button>

    </div>

    <script>
        let myUsername = "";
        let currentChannel = "General";
        let chatData = { "General": "" };

        function capitalizeName(name) {
            if (!name) return "";
            return name.charAt(0).toUpperCase() + name.slice(1);
        }


        async function triggerPython(actionType) {
            myUsername = document.getElementById("username").value.toLowerCase().trim();
            let pass = document.getElementById("password").value;

            document.getElementById("status-text").innerText = "Connecting...";
            await eel.start_client_logic(myUsername, pass, actionType)();
        }

        function getDMChannel(user1, user2) {
            let users = [user1.toLowerCase().trim(), user2.toLowerCase().trim()].sort();
            return "dm_" + users[0] + "_" + users[1];
        }

        function refreshChatBox() {
            if (!chatData[currentChannel]) {
                chatData[currentChannel] = "";
            }

            let historyBox = document.getElementById("chat-history");
            historyBox.innerHTML = chatData[currentChannel];
            historyBox.scrollTop = historyBox.scrollHeight;
        }

        function switchToServer() {
            currentChannel = "General";
            document.getElementById("chat-title").innerText = "Server";
            document.getElementById("chat-history").innerHTML = "<i>Loading server chat...</i>";

            eel.request_channel_history("General")();
        }

        function switchToDM() {
            let targetUser = document.getElementById("dm-user-input").value.trim().toLowerCase();

            if (targetUser === "" || targetUser === myUsername) return;

            currentChannel = getDMChannel(myUsername, targetUser);
            document.getElementById("chat-title").innerText = "DM: " + capitalizeName(targetUser);
            document.getElementById("dm-user-input").value = "";

            document.getElementById("chat-history").innerHTML = "<i>Loading conversation...</i>";

            eel.request_channel_history(currentChannel)();
        }

        function formatMessage(text) {
            let richText = text.replace(/[&<>'"]/g, tag => ({ //for safety dont remove
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));

            richText = richText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            
            richText = richText.replace(/\*(.*?)\*/g, '<i>$1</i>');
            
            richText = richText.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" style="color: #3cff88; text-decoration: underline;">$2</a>');
            
            return richText;
        }

        function sendFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function () {
                const base64String = reader.result;

                let filePayload = {
                    type: "file",
                    filename: file.name,
                    data: base64String
                };

                eel.send_chat_message(filePayload, currentChannel)();
                fileInput.value = "";
            };
            reader.readAsDataURL(file);
        }

        function sendMessage() {
            let msg = document.getElementById("message-input").value;

            if (msg.trim() !== "") {
                eel.send_chat_message(msg, currentChannel)();
                document.getElementById("message-input").value = "";
            }
        }

        eel.expose(updateLoginStatus);
        function updateLoginStatus(text) {
            document.getElementById("status-text").innerText = text;
        }

        eel.expose(showChatWindow);
        function showChatWindow() {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("chat-section").style.display = "block";
            currentChannel = "General";
            refreshChatBox();
        }

        eel.expose(receiveMessageUI);
        function receiveMessageUI(sender, text, channel = "General") {
            if (!chatData[channel]) chatData[channel] = "";

            let cls = "msg";
            if (sender === "SYSTEM") cls += " system";
            else if (sender === myUsername) cls += " self";
            else cls += " other";

            let displayContent = formatMessage(text);
            if (typeof text === 'object' && text !== null && text.type === 'file') {
                displayContent = `<a href="${text.data}" download="${text.filename}" style="color: #3cff88; text-decoration: underline;"> Download ${text.filename}</a>`;
            }

            chatData[channel] += `
                <div class="${cls}">
                    <b>${capitalizeName(sender)}</b>: ${displayContent}
                </div>
            `;

            if (channel === currentChannel) {
                refreshChatBox();
            }
        }

        eel.expose(receiveHistoryUI);
        function receiveHistoryUI(channel, history) {
            let html = "";

            history.forEach(msg => {
                let cls = "msg";
                if (msg.sender === "SYSTEM") cls += " system";
                else if (msg.sender === myUsername) cls += " self";
                else cls += " other";

                let displayContent = formatMessage(msg.message);
                if (typeof msg.message === 'object' && msg.message !== null && msg.message.type === 'file') {
                    displayContent = `<a href="${msg.message.data}" download="${msg.message.filename}" style="color: #3cff88; text-decoration: underline;">Download ${msg.message.filename}</a>`;
                }

                html += `
                    <div class="${cls}">
                        <b>${capitalizeName(msg.sender)}</b>: ${displayContent}
                    </div>
                `;
            });

            chatData[channel] = html;

            if (channel === currentChannel) {
                let historyBox = document.getElementById("chat-history");
                historyBox.innerHTML = html;
                historyBox.scrollTop = historyBox.scrollHeight;
            }
        }
    </script>

</body>

</html>
