<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat Hosted Client</title>
    <link rel="stylesheet" href="style.css?v=15">
    <script src="config.js?v=15"></script>
</head>

<body>
    <main class="shell">
        <section class="hero">
            <p class="eyebrow">Endurance SecureChat</p>
            <h1>Encrypted chat, hosted for the open web.</h1>
        </section>

        <section id="login-section" class="panel">
            <h2>Sign in</h2>
            <label>
                Username
                <input type="text" id="username" autocomplete="username" placeholder="Username">
            </label>
            <label>
                Password
                <input type="password" id="password" autocomplete="current-password" placeholder="Password">
            </label>
            <label>
                Chat Encryption Passphrase
                <input type="password" id="chat-passphrase" autocomplete="off" placeholder="Shared chat passphrase">
            </label>
            <div class="actions">
                <button id="login-button">Login</button>
                <button id="create-button" class="secondary">Create Account</button>
            </div>
            <p id="status-text" class="status"></p>
        </section>

        <section id="chat-section" class="panel chat-panel" hidden style="display: none;">
            <div class="chat-layout">
                <aside class="presence-card">
                    <p class="eyebrow">Online</p>
                    <div id="presence-list" class="presence-list" aria-label="Online users"></div>
                </aside>

                <div class="chat-main">
                    <div class="chat-topbar">
                        <div>
                            <p class="eyebrow">Room</p>
                            <h2 id="chat-title">Server</h2>
                        </div>
                        <div class="room-actions">
                            <button id="switch-room-button" class="secondary">Switch Room</button>
                            <button id="logout-button" class="secondary">Disconnect</button>
                        </div>
                    </div>

                    <div class="dm-controls">
                        <input type="text" id="dm-user-input" placeholder="User to DM">
                        <button id="dm-button">DM User</button>
                        <button id="server-button" class="secondary">Back to Server</button>
                    </div>

                    <div id="chat-history" aria-live="polite"></div>
                    <p id="typing-status" class="typing-status"></p>

                    <div class="file-row">
                        <input type="file" id="file-input">
                        <button id="file-button" class="secondary">Send File</button>
                    </div>
                </div>
            </div>

            <div class="composer">
                <textarea id="message-input" rows="3" placeholder="Type a message. Shift + Enter adds a new line."></textarea>
                <div class="emoji-wrap">
                    <button id="emoji-button" class="secondary emoji-button" title="Open emoji picker" type="button">:)</button>
                    <div id="emoji-picker" class="emoji-picker" hidden></div>
                </div>
                <button id="send-button">Send</button>
            </div>
        </section>
    </main>

    <script src="app.js?v=15"></script>
</body>

</html>
